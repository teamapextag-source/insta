<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 28px;
    }
    h1 { font-size: 22px; font-weight: 600; color: #111; }
    .badge {
      background: #ede9fe; color: #5b21b6;
      border-radius: 20px; padding: 4px 14px;
      font-size: 13px; font-weight: 500;
    }
    .card {
      background: #fff; border-radius: 12px;
      padding: 16px 20px; margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex; align-items: center; gap: 16px;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: #ede9fe; color: #5b21b6;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px; flex-shrink: 0;
    }
    .info { flex: 1; }
    .info strong { font-size: 15px; color: #111; }
    .info span { display: block; font-size: 13px; color: #777; margin-top: 2px; }
    .time { font-size: 12px; color: #aaa; }
    .empty { text-align: center; color: #aaa; padding: 40px 0; font-size: 15px; }
    .clear-btn {
      margin-top: 20px; padding: 10px 24px;
      background: #fff; color: #e74c3c;
      border: 1px solid #e74c3c; border-radius: 8px;
      font-size: 14px; cursor: pointer;
    }
    .clear-btn:hover { background: #fdf0f0; }
    .login-screen {
      background: #fff; border-radius: 16px;
      padding: 40px 36px; max-width: 360px;
      margin: 80px auto; box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      text-align: center;
    }
    .login-screen h2 { font-size: 20px; margin-bottom: 8px; color: #111; }
    .login-screen p { font-size: 14px; color: #888; margin-bottom: 24px; }
    .login-screen input {
      width: 100%; padding: 10px 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 15px; outline: none; margin-bottom: 14px;
    }
    .login-screen input:focus { border-color: #6c63ff; }
    .login-screen button {
      width: 100%; padding: 11px;
      background: #6c63ff; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; cursor: pointer;
    }
    .login-screen button:hover { background: #574fd6; }
    .error { color: #e74c3c; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Login Gate -->
  <div class="login-screen" id="login-screen">
    <h2>Admin Login</h2>
    <p>Enter the password to access submissions.</p>
    <input type="password" id="pass-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPass()" />
    <button onclick="checkPass()">Login</button>
    <p class="error" id="err"></p>
  </div>

  <!-- Admin Panel (hidden until login) -->
  <div class="container" id="admin-panel" style="display:none;">
    <div class="header">
      <h1>Submissions</h1>
      <span class="badge" id="count-badge">0 entries</span>
    </div>
    <div id="entries-list"></div>
    <button class="clear-btn" onclick="clearAll()">🗑 Clear all</button>
  </div>

  <script>
    // ── Change this password ──
    const ADMIN_PASSWORD = 'admin123';

    function checkPass() {
      const val = document.getElementById('pass-input').value;
      if (val === ADMIN_PASSWORD) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        renderEntries();
      } else {
        document.getElementById('err').textContent = 'Incorrect password.';
      }
    }

    function renderEntries() {
      const submissions = JSON.parse(localStorage.getItem('submissions') || '[]');
      const list = document.getElementById('entries-list');
      const badge = document.getElementById('count-badge');
      badge.textContent = submissions.length + (submissions.length === 1 ? ' entry' : ' entries');
      if (submissions.length === 0) {
        list.innerHTML = '<p class="empty">No submissions yet.</p>';
        return;
      }
      list.innerHTML = submissions.map(s => {
        const initials = s.username.replace('@','').slice(0,2).toUpperCase();
        return `<div class="card">
          <div class="avatar">${initials}</div>
          <div class="info">
            <strong>${s.username}</strong>
            <span>Hobby: ${s.hobby}</span>
          </div>
          <span class="time">${s.time}</span>
        </div>`;
      }).join('');
    }

    function clearAll() {
      if (confirm('Delete all submissions?')) {
        localStorage.removeItem('submissions');
        renderEntries();
      }
    }
  </script>
</body>
</html>
